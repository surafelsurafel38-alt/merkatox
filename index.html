<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MerkatoX | ኦንላይን ገበያ</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #f8fafc; color: #0f172a; padding-bottom: 50px; }
        
        header { background: #ffffff; padding: 15px 20px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: 800; color: #2563eb; text-decoration: none; }
        
        .user-actions { display: flex; gap: 10px; align-items: center; }
        .btn-auth { padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid #cbd5e1; background: #fff; }
        .btn-sell { background: #16a34a; color: white; border: none; padding: 10px 18px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; }
        .btn-sell:hover { background: #15803d; }

        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; margin-top: 20px; }
        
        .card { background: white; border-radius: 12px; padding: 15px; border: 1px solid #e2e8f0; display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
        .card h3 { font-size: 16px; margin-bottom: 5px; }
        .card .price { color: #2563eb; font-weight: 800; font-size: 18px; margin: 8px 0; }
        
        .action-btns { display: flex; gap: 8px; margin-top: 10px; }
        .buy-btn { flex: 1; text-align: center; background: #2563eb; color: white; border: none; padding: 9px; border-radius: 6px; font-weight: 700; font-size: 13px; cursor: pointer; }
        .buy-btn:hover { background: #1d4ed8; }
        .tg-btn { text-align: center; background: #22c55e; color: white; text-decoration: none; padding: 9px 12px; border-radius: 6px; font-weight: 700; font-size: 13px; }

        /* Modal Box CSS */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-overlay.active {
            display: flex !important;
        }

        .modal-card {
            background: #ffffff;
            width: 90%; max-width: 420px;
            border-radius: 16px;
            padding: 25px;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 22px; cursor: pointer; font-weight: bold; color: #64748b; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
        .submit-btn { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .submit-btn-success { background: #16a34a; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">MerkatoX.</a>
        <div class="user-actions">
            <div id="authButtons">
                <button class="btn-auth" onclick="showModal('loginModal')">🔑 ግባ</button>
                <button class="btn-auth" onclick="showModal('signupModal')">✨ ተመዝገብ</button>
            </div>
            <div id="userProfile" style="display:none; align-items:center; gap:8px;">
                <span id="userNameDisplay" style="font-weight:700; font-size:13px; color:#2563eb;"></span>
                <button class="btn-auth" onclick="logout()">ውጣ</button>
            </div>
            <button class="btn-sell" onclick="clickSellButton()">➕ እቃ ለመሸጥ</button>
        </div>
    </header>

    <div class="container">
        <h2>🛍️ የቀረቡ እቃዎች</h2>
        <div class="product-grid" id="productGrid"></div>
    </div>

    <!-- 1. SIGNUP MODAL -->
    <div id="signupModal" class="modal-overlay">
        <div class="modal-card">
            <span class="close-btn" onclick="hideModal('signupModal')">&times;</span>
            <h3 style="margin-bottom: 15px;">አካውንት ይክፈቱ</h3>
            <form onsubmit="handleSignUp(event)">
                <div class="form-group">
                    <label>ስም</label>
                    <input type="text" id="signUpName" required placeholder="ምሳሌ፦ አበበ">
                </div>
                <div class="form-group">
                    <label>ስልክ ቁጥር</label>
                    <input type="tel" id="signUpPhone" required placeholder="09...">
                </div>
                <button type="submit" class="submit-btn">ተመዝገብ</button>
            </form>
        </div>
    </div>

    <!-- 2. LOGIN MODAL -->
    <div id="loginModal" class="modal-overlay">
        <div class="modal-card">
            <span class="close-btn" onclick="hideModal('loginModal')">&times;</span>
            <h3 style="margin-bottom: 15px;">ወደ አካውንትዎ ይግቡ</h3>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>ስልክ ቁጥር</label>
                    <input type="tel" id="loginPhone" required placeholder="09...">
                </div>
                <button type="submit" class="submit-btn">ግባ</button>
            </form>
        </div>
    </div>

    <!-- 3. SELL ITEM MODAL (የእቃ መሸጫ ፎርም) -->
    <div id="sellModal" class="modal-overlay">
        <div class="modal-card">
            <span class="close-btn" onclick="hideModal('sellModal')">&times;</span>
            <h3 style="margin-bottom: 15px;">የሚሸጡትን እቃ ያስገቡ</h3>
            <form onsubmit="handlePostItem(event)">
                <div class="form-group">
                    <label>የእቃው ስም</label>
                    <input type="text" id="itemTitle" required placeholder="ምሳሌ፦ Nike Shoes">
                </div>
                <div class="form-group">
                    <label>ዋጋ (ብር)</label>
                    <input type="number" id="itemPrice" required placeholder="2500">
                </div>
                <div class="form-group">
                    <label>የፎቶ ሊንክ (Image URL)</label>
                    <input type="url" id="itemImage" value="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500">
                </div>
                <div class="form-group">
                    <label>መግለጫ</label>
                    <textarea id="itemDesc" rows="2" placeholder="የእቃው ሁኔታ..."></textarea>
                </div>
                <button type="submit" class="submit-btn submit-btn-success">🚀 እቃውን ለጥፍ</button>
            </form>
        </div>
    </div>

    <!-- 4. BUY ITEM MODAL (የእቃ መግዣ/ማዘዣ ፎርም) -->
    <div id="buyModal" class="modal-overlay">
        <div class="modal-card">
            <span class="close-btn" onclick="hideModal('buyModal')">&times;</span>
            <h3 id="buyItemTitle" style="margin-bottom: 5px; color:#2563eb;">የእቃው ስም</h3>
            <p id="buyItemPrice" style="font-weight:700; margin-bottom:15px; color:#16a34a;"></p>
            
            <form onsubmit="handleSendOrder(event)">
                <input type="hidden" id="selectedItemName">
                <input type="hidden" id="selectedItemPrice">
                
                <div class="form-group">
                    <label>የእርስዎ ስም</label>
                    <input type="text" id="buyerName" required placeholder="ምሳሌ፦ ከበደ">
                </div>
                <div class="form-group">
                    <label>ስልክ ቁጥር</label>
                    <input type="tel" id="buyerPhone" required placeholder="09...">
                </div>
                <div class="form-group">
                    <label>መቀበያ አድራሻ (ከተማ/ሰፈር)</label>
                    <input type="text" id="buyerAddress" required placeholder="ምሳሌ፦ አዲስ አበባ፣ ቦሌ">
                </div>
                <button type="submit" class="submit-btn submit-btn-success">📩 ትእዛዝ ላክ (Order Now)</button>
            </form>
        </div>
    </div>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('merkatoX_user')) || null;
        let products = JSON.parse(localStorage.getItem('merkatoX_products')) || [
            { id: 1, title: "Nike Air Max", price: "3,200", img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500", seller: "MerkatoX" },
            { id: 2, title: "Smart Watch", price: "2,500", img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500", seller: "MerkatoX" }
        ];

        window.onload = function() {
            updateUserUI();
            renderProducts();
        };

        function showModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function hideModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function clickSellButton() {
            if (!currentUser) {
                alert("እቃ ለመሸጥ አስቀድመው አካውንት መክፈት ወይም መግባት (Login) አለብዎት!");
                showModal('loginModal');
            } else {
                showModal('sellModal');
            }
        }

        // ገዢዎች "ግዛ" የሚለውን ሲጫኑ ፎርም እንዲከፈት የሚያደርግ
        function openBuyModal(title, price) {
            document.getElementById('buyItemTitle').innerText = "🛍️ " + title;
            document.getElementById('buyItemPrice').innerText = "ዋጋ፦ " + price + " ብር";
            document.getElementById('selectedItemName').value = title;
            document.getElementById('selectedItemPrice').value = price;
            
            showModal('buyModal');
        }

        // ትእዛዝ ወደ ቴሌግራም መላኪያ
        function handleSendOrder(e) {
            e.preventDefault();
            const item = document.getElementById('selectedItemName').value;
            const price = document.getElementById('selectedItemPrice').value;
            const buyer = document.getElementById('buyerName').value;
            const phone = document.getElementById('buyerPhone').value;
            const address = document.getElementById('buyerAddress').value;

            const msg = `🛒 **አዲስ የግዢ ትእዛዝ መጥቷል!**%0A%0A📦 **እቃ፦** ${item}%0A💰 **ዋጋ፦** ${price} ብር%0A%0A👤 **የገዢው ስም፦** ${buyer}%0A📞 **ስልክ፦** ${phone}%0A📍 **አድራሻ፦** ${address}`;
            
            // ወደ እርሶ ቴሌግራም ይልካቸዋል
            window.open(`https://t.me/Tvwlute?text=${msg}`, '_blank');
            hideModal('buyModal');
        }

        function handleSignUp(e) {
            e.preventDefault();
            const name = document.getElementById('signUpName').value;
            const phone = document.getElementById('signUpPhone').value;

            currentUser = { name: name, phone: phone };
            localStorage.setItem('merkatoX_user', JSON.stringify(currentUser));
            
            updateUserUI();
            hideModal('signupModal');
            alert(`እንኳን ደስ አለዎት ${name}! አካውንትዎ ተከፍቷል።`);
        }

        function handleLogin(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value;

            currentUser = { name: "ተጠቃሚ (" + phone.slice(-4) + ")", phone: phone };
            localStorage.setItem('merkatoX_user', JSON.stringify(currentUser));

            updateUserUI();
            hideModal('loginModal');
            alert("በተሳካ ሁኔታ ገብተዋል!");
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('merkatoX_user');
            updateUserUI();
        }

        function updateUserUI() {
            if (currentUser) {
                document.getElementById('authButtons').style.display = 'none';
                document.getElementById('userProfile').style.display = 'flex';
                document.getElementById('userNameDisplay').innerText = '👤 ' + currentUser.name;
            } else {
                document.getElementById('authButtons').style.display = 'block';
                document.getElementById('userProfile').style.display = 'none';
            }
        }

        function handlePostItem(e) {
            e.preventDefault();
            const title = document.getElementById('itemTitle').value;
            const price = document.getElementById('itemPrice').value;
            const img = document.getElementById('itemImage').value;

            const newItem = {
                id: Date.now(),
                title: title,
                price: Number(price).toLocaleString(),
                img: img || "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500",
                seller: currentUser.name
            };

            products.unshift(newItem);
            localStorage.setItem('merkatoX_products', JSON.stringify(products));

            renderProducts();
            hideModal('sellModal');
            alert("🎉 እቃዎ በተሳካ ሁኔታ ተለጥፏል!");
        }

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            products.forEach(item => {
                grid.innerHTML += `
                    <div class="card">
                        <div>
                            <img src="${item.img}" alt="${item.title}">
                            <h3>${item.title}</h3>
                            <p style="font-size:12px; color:#64748b;">👤 ሻጭ: ${item.seller}</p>
                            <div class="price">${item.price} ብር</div>
                        </div>
                        <div class="action-btns">
                            <button class="buy-btn" onclick="openBuyModal('${item.title}', '${item.price}')">🛍️ ግዛ</button>
                            <a href="https://t.me/Tvwlute" target="_blank" class="tg-btn">✈️ ቴሌግራም</a>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
