<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የኔ Marketplace</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f4f4f4; text-align: center; }
        header { background-color: #232f3e; color: white; padding: 15px; }
        .container { display: flex; justify-content: center; gap: 20px; margin-top: 30px; flex-wrap: wrap; }
        .card { background: white; padding: 15px; border-radius: 8px; width: 220px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 5px; }
        .price { color: #B12704; font-weight: bold; font-size: 18px; }
        button { background-color: #ffd814; border: 1px solid #fcd200; padding: 10px 15px; cursor: pointer; border-radius: 20px; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { background-color: #f7ca00; }
    </style>
</head>
<body>

    <header>
        <h1>እንኳን ወደ ገበያችን በሰላም መጡ!</h1>
    </header>

    <div class="container">
        <!-- product 1 -->
        <div class="card">
            <img src="https://via.placeholder.com/150" alt="ጫማ">
            <h3>የወንዶች ጫማ</h3>
            <p class="price">2,500 ብር</p>
            <button onclick="orderProduct('የወንዶች ጫማ', 2500)">አሁኑኑ ይዘዙ</button>
        </div>

        <!-- product 2 -->
        <div class="card">
            <img src="https://via.placeholder.com/150" alt="ስልክ">
            <h3>ስማርት ስልክ</h3>
            <p class="price">18,000 ብር</p>
            <button onclick="orderProduct('ስማርት ስልክ', 18000)">አሁኑኑ ይዘዙ</button>
        </div>
    </div>

    <script>
        function orderProduct(name, price) {
            // እዚህ ላይ የራስህን የቴሌግራም የተጠቃሚ ስም (Username) አስገባ
            let telegramUsername = "YOUR_TELEGRAM_USERNAME"; 
            let message = ሰላም! ይህንን እቃ ማዘዝ እፈልጋለሁ፡\nእቃ፡ ${name}\nዋጋ፡ ${price} ብር;
            
            window.open(https://t.me/${telegramUsername}?text=${encodeURIComponent(message)}, '_blank');
        }
    </script>

</body>
</html>
